<!DOCTYPE html>
<!-- Documento HTML5 com o idioma definido como português do Brasil -->
<html lang="pt-BR">

<head>
    <!-- Codificação UTF-8 para mostrar os acentos e o símbolo R$ sem erro -->
    <meta charset="UTF-8">
    <!-- Faz a página se ajustar à largura da tela do celular e do tablet -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Descrição curta que aparece no Google -->
    <meta name="description" content="Pastelaria da Vila: pastel frito na hora na Vila Hortência, em Sorocaba. Cardápio, horário e pedidos pelo WhatsApp.">
    <!-- Título que aparece na aba do navegador -->
    <title>Pastelaria da Vila | Pastel frito na hora em Sorocaba</title>
    <!-- CSS EXTERNO: todo o visual do site fica no arquivo style.css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ===================== FAIXA DE AVISO =====================
         Tira escura bem no alto da página, com os recados rápidos da casa.
         O id="topo" é o destino do botão "voltar ao topo" -->
    <div id="topo">
        <p>Aberto de terça a domingo &middot; Entrega na Vila Hortência e região &middot; Aceitamos Pix e cartão</p>
    </div>

    <!-- ===================== CABEÇALHO =====================
         Nome da pastelaria, menu com links de âncora para as seções
         e o botão de pedido pelo WhatsApp -->
    <header id="cabecalho">
        <!-- A div usa duas classes: container (largura máxima) e cabecalho-conteudo (flex) -->
        <div class="container cabecalho-conteudo">
            <!-- Logo em texto: o link leva de volta ao começo da página -->
            <a href="#inicio" id="logo">
                Pastelaria da Vila
                <!-- Este span tem display: block no CSS, por isso fica embaixo do nome -->
                <span class="logo-desde">Desde 1994 &middot; Sorocaba</span>
            </a>

            <!-- Menu de navegação: cada href="#..." aponta para o id de uma seção da página -->
            <nav id="menu" aria-label="Menu principal">
                <ul>
                    <li><a href="#cardapio">Cardápio</a></li>
                    <li><a href="#promocoes">Promoções</a></li>
                    <li><a href="#historia">Nossa história</a></li>
                    <li><a href="#avaliacoes">Avaliações</a></li>
                    <li><a href="#funcionamento">Horário e endereço</a></li>
                </ul>
            </nav>

            <!-- Botão de pedido: o link wa.me abre uma conversa no WhatsApp (número fictício).
                 target="_blank" abre em outra aba -->
            <a href="https://wa.me/5515900000000?text=Oi!%20Quero%20fazer%20um%20pedido." class="botao botao-amarelo" target="_blank" rel="noopener">Peça pelo WhatsApp</a>
        </div>
    </header>

    <!-- Conteúdo principal da página: cada parte do site é uma <section> -->
    <main>
    </main>
</body>

</html>
